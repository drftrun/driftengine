<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 233.30 207.08" color="#ececf0">
  <!--
    The vertical lockup: the mark over the word.

    The word is outlines rather than text, so this file renders identically on a machine with no
    fonts installed and inside a shell that has no access to any. Drawn from Fira Sans (SIL Open
    Font License 1.1) at Light for "Drift" and SemiBold for "Engine": the weight break is what
    carries the compound word without a space or a capital doing the work, and the colour break
    puts the engine's own accent on the half that names it.

    Nothing here is a font dependency: no font is embedded, distributed or required. These are
    curves.

    "Drift" is `currentColor` so the half that is not the accent follows whatever surface this is
    placed on; the root carries the dark-surface default, which is what a standalone view or an
    `<img>` gets. The mark is centred on the *cube* rather than on the composition's bounding box:
    the streaks drag that box left, and centring on it puts the cube visibly off the word's axis.  -->
  <style>
    /* The half that is not the accent follows its surface. A file referenced as an image gets
       these defaults; an inline copy can be overridden by setting `color` on any ancestor.
       No angle brackets in here: this is XML, and a tag name inside a CSS comment is a tag. */
    :root { color: #ececf0; }
    @media (prefers-color-scheme: light) { :root { color: #14141a; } }
  </style>
