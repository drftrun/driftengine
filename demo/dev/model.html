<!doctype html>
<meta charset="utf-8" />
<title>DriftEngine — model materials</title>
<style>
  :root {
    color-scheme: dark;
  }
  body {
    margin: 0;
    background: #0b0d10;
    color: #d7dde5;
    font:
      13px/1.5 ui-monospace,
      monospace;
  }
  #stage {
    position: relative;
    height: 100vh;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
  }
  canvas:active {
    cursor: grabbing;
  }
  #stats {
    position: absolute;
    left: 0.7rem;
    bottom: 0.7rem;
    color: #8aa0b6;
    pointer-events: none;
  }
  #help {
    position: absolute;
    right: 0.7rem;
    top: 0.7rem;
    color: #6d7f92;
    text-align: right;
    pointer-events: none;
  }
  #error {
    position: absolute;
    left: 0.7rem;
    top: 0.7rem;
    color: #ff9b9b;
    white-space: pre-wrap;
  }
</style>
<div id="stage">
  <canvas id="canvas"></canvas>
  <div id="stats"></div>
  <div id="help">drag to orbit · wheel to zoom</div>
  <div id="error"></div>
</div>
<script type="module" src="./model.ts"></script>
