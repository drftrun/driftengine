<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DriftEngine starter</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0e12;
        color: #c9cdd6;
        font:
          13px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      /* The canvas is sized by CSS; `renderer.resize()` reads that size back. */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #backend {
        position: fixed;
        top: 12px;
        left: 14px;
        margin: 0;
        padding: 6px 10px;
        border-radius: 6px;
        background: #00000080;
        pointer-events: none;
      }
      #home {
        position: fixed;
        top: 12px;
        right: 14px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px dashed #ffffff2e;
        background: #12141ad9;
        color: #c9cdd6;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <p id="backend">starting…</p>
    <!-- Only for the served index; delete this line when copying the folder into a project. -->
    <a id="home" href="../">← all examples</a>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
