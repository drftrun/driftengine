<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recording · DriftEngine example</title>
    <link rel="stylesheet" href="../common/examples.css" />
    <style>
      /* Still, record and render, what happened, and the file it made. */
      #panel {
        position: fixed;
        top: 64px;
        right: 14px;
        width: 240px;
        padding: 10px 12px;
        border: 1px solid #2a2d36;
        border-radius: 10px;
        background: rgba(22, 24, 30, 0.88);
      }
      #panel button {
        display: block;
        width: 100%;
        margin: 0 0 6px;
        font: inherit;
        color: #c9cdd6;
        background: #22252e;
        border: 1px solid #343845;
        border-radius: 6px;
        padding: 4px 8px;
        cursor: pointer;
        text-align: left;
      }
      #panel button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #note {
        min-height: 1.5em;
        margin: 4px 0 8px;
        color: #e3a46c;
        line-height: 1.4;
      }
      #result img,
      #result video {
        display: block;
        width: 100%;
        max-height: 220px;
        object-fit: contain;
        background: #000;
        border-radius: 6px;
      }
      #result a {
        display: block;
        margin-top: 6px;
        color: #8fb8ff;
      }
      @media (max-width: 640px) {
        #panel {
          width: 170px;
        }
        #result {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <p id="backend">starting…</p>
    <a id="home" href="../">← all examples</a>
    <aside id="panel">
      <button type="button" id="still">Save a still</button>
      <button type="button" id="record">Record four seconds</button>
      <button type="button" id="render">Render four seconds</button>
      <p id="note"></p>
      <div id="result"></div>
    </aside>
    <nav id="controls"></nav>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
